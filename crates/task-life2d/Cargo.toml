[package]
name = "task-life2d"
description = "2D Game of Life task: globally exact, generation-tagged halo exchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Plonky3 AIR for k generations of Conway's rule and the `plonky3` proof backend.
# GPU-resident prover for the Keccak config (`air::gpu`, `UMIS_GPU_PROVE=1`; needs CUDA to build).
cuda = ["stark", "dep:umis-gpu", "dep:p3-commit", "dep:p3-dft", "dep:p3-fri", "dep:p3-symmetric"]
stark = ["dep:umis-stark", "dep:umis-proof", "dep:p3-air", "dep:p3-uni-stark", "dep:p3-batch-stark", "dep:p3-field", "dep:p3-matrix", "dep:p3-maybe-rayon", "dep:postcard", "dep:p3-koala-bear", "dep:p3-poseidon2", "dep:p3-symmetric"]

[dependencies]
umis-core.workspace = true
umis-task.workspace = true
borsh.workspace = true
serde.workspace = true
serde_json.workspace = true
rand_chacha.workspace = true
umis-stark = { workspace = true, optional = true }
umis-proof = { workspace = true, optional = true }
p3-air = { version = "=0.9.0-rc.2", optional = true }
p3-uni-stark = { version = "=0.9.0-rc.2", optional = true }
p3-batch-stark = { version = "=0.9.0-rc.2", optional = true }
umis-gpu = { path = "../umis-gpu", optional = true, features = ["cuda"] }
p3-commit = { version = "=0.9.0-rc.2", optional = true }
p3-dft = { version = "=0.9.0-rc.2", optional = true }
p3-fri = { version = "=0.9.0-rc.2", optional = true }
p3-symmetric = { version = "=0.9.0-rc.2", optional = true }
p3-koala-bear = { version = "=0.9.0-rc.2", optional = true }
p3-poseidon2 = { version = "=0.9.0-rc.2", optional = true }
p3-field = { version = "=0.9.0-rc.2", optional = true }
p3-matrix = { version = "=0.9.0-rc.2", optional = true }
# Parallel trace generation natively (umis-stark turns on `parallel` off wasm32).
p3-maybe-rayon = { version = "=0.9.0-rc.2", optional = true }
postcard = { version = "1.1", default-features = false, features = ["alloc"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[dev-dependencies]
anyhow = "1"
borsh.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[[example]]
name = "bench_life_air"
required-features = ["stark"]

[[example]]
name = "gpu_throughput"
required-features = ["cuda"]
