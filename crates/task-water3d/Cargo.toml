[package]
name = "task-water3d"
description = "3D water-current simulation task"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Plonky3 AIR for the stencil and the `plonky3` proof backend (milestone 7).
stark = ["dep:umis-stark", "dep:umis-proof", "dep:p3-air", "dep:p3-batch-stark", "dep:p3-field", "dep:p3-lookup", "dep:p3-matrix", "dep:postcard"]

[dependencies]
umis-core.workspace = true
umis-task.workspace = true
borsh.workspace = true
serde.workspace = true
serde_json.workspace = true
rand_chacha.workspace = true
umis-stark = { workspace = true, optional = true }
umis-proof = { workspace = true, optional = true }
p3-air = { version = "=0.8.0", optional = true }
p3-batch-stark = { version = "=0.8.0", optional = true }
p3-field = { version = "=0.8.0", optional = true }
p3-lookup = { version = "=0.8.0", optional = true }
p3-matrix = { version = "=0.8.0", optional = true }
postcard = { version = "1.1", default-features = false, features = ["alloc"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[dev-dependencies]
borsh.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.58"
web-time.workspace = true

[lints]
workspace = true

[[example]]
name = "bench_air"
required-features = ["stark"]
