[package]
name = "umis-agg"
version = "0.1.0"
edition = "2024"
description = "Recursive aggregation of umis leaf STARKs with Plonky3-recursion (native only)"
publish = false

[dependencies]
# Plonky3-recursion: unaudited, not usable from crates.io; pinned to a commit (approved 2026-11-20).
p3-recursion = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-circuit = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-circuit-prover = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-poseidon2-circuit-air = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
umis-stark = { path = "../umis-stark" }
umis-stencil = { path = "../umis-stencil" }
task-stencil = { path = "../task-stencil" }
task-life2d = { path = "../task-life2d", features = ["stark"] }
umis-core = { path = "../umis-core" }
umis-proof = { path = "../umis-proof" }
postcard = { version = "1.1", features = ["alloc"] }
p3-air = "=0.9.0-rc.2"
p3-batch-stark = "=0.9.0-rc.2"
p3-challenger = "=0.9.0-rc.2"
p3-commit = "=0.9.0-rc.2"
p3-field = "=0.9.0-rc.2"
p3-fri = "=0.9.0-rc.2"
p3-koala-bear = "=0.9.0-rc.2"
p3-lookup = "=0.9.0-rc.2"
p3-matrix = "=0.9.0-rc.2"
p3-uni-stark = "=0.9.0-rc.2"

[lints]
workspace = true

[dev-dependencies]
umis-task = { path = "../umis-task" }
borsh = { workspace = true }
